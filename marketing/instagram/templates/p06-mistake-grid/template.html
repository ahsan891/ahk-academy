<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>p06 — 3 mistakes grid</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .title { font-family: var(--font-display); font-weight: 900; font-size: 68px; line-height: 1.1; max-height: 240px; overflow: hidden; margin-top: 20px; }
  .items { display: flex; flex-direction: column; gap: 24px; margin-top: 40px; }
  .it { background: var(--white); color: var(--navy); border-radius: var(--r-md); padding: 26px 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 26px; box-shadow: var(--shadow-md); }
  .it .w, .it .r { display: flex; align-items: center; gap: 16px; font-family: var(--font-body); font-weight: 800; font-size: 34px; line-height: 1.2; max-height: 90px; overflow: hidden; }
  .it .w { color: #8A94AA; text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 4px; }
  .it .mark-x, .it .mark-ok { width: 48px; height: 48px; font-size: 26px; }
  .it .why { grid-column: 1 / -1; font-size: 28px; line-height: 1.3; color: var(--ink-2); border-top: 2px solid var(--navy-soft); padding-top: 12px; max-height: 80px; overflow: hidden; }
  .foot { margin-top: 36px; font-size: 34px; font-weight: 600; opacity: .9; }
</style>
</head>
<body>
<div class="stage bg-navy on-dark">
  <div class="deco-dots"></div>
  <div class="star-wm" style="left:-300px; bottom:-300px; width:860px; height:860px"></div>
  <div class="content">
    <div class="label" id="label"></div>
    <div class="title" id="title" data-fit="40"></div>
    <div class="items" id="items"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script src="../../assets/base.js"></script>
<script>
AHK.template({
  format: 'post',
  build(d) {
    AHK.chrome({ tag: 'MISTAKES' });
    AHK.$('#label').textContent = d.label;
    AHK.$('#title').textContent = d.title;
    const box = AHK.$('#items');
    d.items.forEach(it => box.append(AHK.h('div.it', [
      AHK.h('div.w', { 'data-fit': '24' }, [AHK.h('span.mark-x', '✗'), AHK.h('span', it.wrong)]),
      AHK.h('div.r', { 'data-fit': '24' }, [AHK.h('span.mark-ok', '✓'), AHK.h('span', it.right)]),
      AHK.h('div.why', { 'data-fit': '22', html: AHK.rich(it.why) }),
    ])));
    AHK.$('#foot').innerHTML = AHK.rich(d.footer);
  }
});
</script>
</body>
</html>
