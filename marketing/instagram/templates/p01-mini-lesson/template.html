<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>p01 — Carousel mini-lesson</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .cover .title { font-family: var(--font-display); font-weight: 900; font-size: 92px; line-height: 1.08; max-height: 500px; overflow: hidden; }
  .cover .sub { font-size: 40px; line-height: 1.3; margin-top: 30px; opacity: .85; max-height: 160px; overflow: hidden; }
  .cover .swipe { margin-top: 50px; }
  .step .n { font-family: var(--font-display); font-weight: 900; font-size: 150px; line-height: 1; color: var(--gold); letter-spacing: -.05em; }
  .step .t { font-family: var(--font-display); font-weight: 900; font-size: 56px; line-height: 1.12; margin-top: 10px; max-height: 190px; overflow: hidden; }
  .step .b { font-size: 36px; line-height: 1.4; margin-top: 24px; color: var(--ink-2); max-height: 210px; overflow: hidden; }
  .step .ex { margin-top: 34px; background: var(--navy); color: var(--white); border-radius: var(--r-md); padding: 30px 38px; font-size: 38px; font-weight: 600; line-height: 1.3; max-height: 190px; overflow: hidden; }
  .step .ex mark { color: var(--gold); }
  .last .t { font-family: var(--font-display); font-weight: 900; font-size: 76px; line-height: 1.1; color: var(--navy); max-height: 360px; overflow: hidden; }
  .last .b { font-size: 40px; line-height: 1.35; margin-top: 30px; color: var(--navy); max-height: 220px; overflow: hidden; }
  .last .row { margin-top: 50px; gap: 20px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="stage"><div class="slides" id="slides"></div></div>
<script src="../../assets/base.js"></script>
<script>
AHK.template({
  format: 'carousel',
  build(d) {
    const slides = AHK.$('#slides'), n = d.steps.length + 2;
    const mk = (cls, dark, i, inner) => {
      const s = AHK.h('div.slide.' + cls + (dark ? '.on-dark' : ''), [AHK.h('div.content', inner)]);
      slides.append(s);
      AHK.chrome({ stage: s, dark, tag: `${i + 1} / ${n}` });
      if (i < n - 1) s.append(AHK.h('div.swipe-hint', 'Kaydır →'));
      return s;
    };
    mk('cover bg-navy', true, 0, [AHK.h('div.deco-dots'), AHK.h('div.label', d.label), AHK.h('div.title', { 'data-fit': '48', style: 'margin-top:30px' }, d.title), AHK.h('div.sub', d.subtitle), AHK.h('div.swipe', [AHK.h('span.cta', 'Kaydır → ' + n + ' slayt')])]);
    d.steps.forEach((st, i) => mk('step bg-off', false, i + 1, [AHK.h('div.n', String(i + 1).padStart(2, '0')), AHK.h('div.t', { 'data-fit': '36' }, st.title), AHK.h('div.b', { 'data-fit': '26', html: AHK.rich(st.body) }), AHK.h('div.ex', { 'data-fit': '26', html: AHK.rich(st.example) })]));
    mk('last bg-gold', false, n - 1, [AHK.h('div.star-img', { style: 'width:150px;height:170px' }), AHK.h('div.t', { 'data-fit': '40', style: 'margin-top:30px' }, d.cta_title), AHK.h('div.b', { 'data-fit': '28' }, d.cta_body), AHK.h('div.row', [AHK.h('span.cta.navy', '🔖 Kaydet'), AHK.h('span.cta.white', '📤 Paylaş'), AHK.h('span.cta.white', '💬 Yorumla')])]);
  }
});
</script>
</body>
</html>
