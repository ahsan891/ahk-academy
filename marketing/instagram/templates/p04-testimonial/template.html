<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>p04 — Student win</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .qmark { font-family: var(--font-display); font-weight: 900; font-size: 220px; line-height: .6; color: var(--gold); height: 120px; }
  .quote { font-family: var(--font-body); font-weight: 700; font-size: 52px; line-height: 1.3; color: var(--navy); max-height: 480px; overflow: hidden; }
  .who { margin-top: 44px; display: flex; align-items: center; gap: 28px; }
  .who .av { width: 110px; height: 110px; border-radius: 50%; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 48px; flex: none; }
  .who .name { font-family: var(--font-display); font-weight: 900; font-size: 40px; }
  .who .goal { font-size: 30px; color: var(--ink-2); margin-top: 6px; }
  .result { margin-top: 44px; display: inline-flex; align-items: center; gap: 24px; background: var(--navy); color: var(--white); border-radius: 999px; padding: 22px 40px 22px 24px; align-self: flex-start; box-shadow: var(--shadow-md); }
  .result .v { font-family: var(--font-display); font-weight: 900; font-size: 56px; color: var(--gold); background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 28px; }
  .result .l { font-size: 30px; font-weight: 600; letter-spacing: .06em; }
  .stars { display: flex; gap: 10px; margin-top: 30px; }
  .stars .star { width: 40px; height: 40px; background: var(--gold); }
</style>
</head>
<body>
<div class="stage bg-off on-light">
  <div class="deco-dots dark"></div>
  <div class="star-wm" style="right:-320px; bottom:-320px; width:900px; height:900px"></div>
  <div class="content">
    <div class="label navy" id="label"></div>
    <div class="qmark" style="margin-top:20px">“</div>
    <div class="quote" id="quote" data-fit="32"></div>
    <div class="who"><div class="av" id="av"></div><div><div class="name" id="name"></div><div class="goal" id="goal"></div></div></div>
    <div class="result"><span class="v" id="result"></span><span class="l" id="rlabel"></span></div>
    <div class="stars"><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i></div>
  </div>
</div>
<script src="../../assets/base.js"></script>
<script>
AHK.template({
  format: 'post',
  build(d) {
    AHK.chrome({ tag: 'STUDENT' });
    AHK.$('#label').textContent = d.label;
    AHK.$('#quote').textContent = d.quote;
    AHK.$('#av').textContent = d.name.trim()[0].toLocaleUpperCase('tr');
    AHK.$('#name').textContent = d.name;
    AHK.$('#goal').textContent = d.goal;
    AHK.$('#result').textContent = d.result;
    AHK.$('#rlabel').textContent = d.result_label;
  }
});
</script>
</body>
</html>
