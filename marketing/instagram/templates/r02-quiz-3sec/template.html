<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r02 — 3-second quiz</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .q { max-height: 300px; overflow: hidden; margin: 32px 0 50px; }
  .opts { display: flex; flex-direction: column; gap: 22px; }
  .pill-opt { position: relative; }
  .pill-opt .txt { flex: 1; max-height: 140px; overflow: hidden; line-height: 1.2; }
  .pill-opt .ok { position: absolute; right: -25px; top: -25px; }
  .timer { margin-top: 50px; display: flex; align-items: center; gap: 35px; }
  .timer .timer-bar { flex: 1; background: rgba(14,31,62,.12); }
  .timer .n { font-family: var(--font-display); font-weight: 900; font-size: 80px; width: 112px; text-align: center; color: var(--blue); }
  .expl { margin-top: 38px; display: flex; gap: 25px; font-size: 42px; line-height: 1.35; max-height: 188px; overflow: hidden; color: var(--ink); }
  .expl .star-bullet { margin-top: 10px; width: 40px; height: 40px; }
  .prompt { margin-top: 50px; }
</style>
</head>
<body>
<div class="stage bg-off on-light">
  <div class="deco-grid"></div>
  <div class="star-wm" style="left:-320px; top:1180px; width:800px; height:800px"></div>
  <div class="content">
    <div class="label navy" id="label" data-anim="in-left@0"></div>
    <div class="h-lg q" id="q" data-fit="50" data-anim="in-up@0.15"></div>
    <div class="opts" id="opts"></div>
    <div class="slot tail" style="height:360px">
      <div class="timer" data-anim="in-fade@1.4 out-fade@4.9">
        <div class="timer-bar"><i data-anim="drain@1.7:3"></i></div>
        <div class="n" id="num">3</div>
      </div>
      <div>
        <div class="expl" data-anim="in-up@5.9 out-fade@9.4"><span class="star-bullet"></span><div id="expl"></div></div>
        <div class="prompt" data-anim="in-pop@7.4 out-fade@9.4"><div class="cta navy" id="prompt"></div></div>
      </div>
    </div>
  </div>
  <div class="star-transition" data-anim="star-burst@4.7"></div>
</div>
<script src="../../assets/base.js"></script>
<script>
const KEYS = ['A', 'B', 'C', 'D'];
AHK.template({
  format: 'reel', duration: 10, preview: 8.6,
  build(d) {
    AHK.chrome({ tag: d.tag || 'QUIZ' });
    AHK.$('#label').textContent = d.label;
    AHK.$('#q').innerHTML = AHK.rich(d.question);
    const box = AHK.$('#opts');
    d.options.forEach((o, i) => {
      const ok = i === d.answer;
      const el = AHK.h('div.pill-opt', { 'data-anim': `in-left@${(0.6 + i * 0.22).toFixed(2)}${ok ? ' pulse@5.1:0.6:2' : ' dim@4.95'} out-fade@9.4` }, [
        AHK.h('span.key', KEYS[i]), AHK.h('div.txt', { 'data-fit': '35', text: o }),
        ok ? AHK.h('div.mark-ok.ok', { 'data-anim': 'in-pop@5.0' }, '✓') : null,
      ]);
      if (ok) el.dataset.ok = '1';
      box.append(el);
    });
    AHK.$('#expl').innerHTML = AHK.rich(d.explanation);
    AHK.$('#prompt').textContent = d.comment_prompt;
  },
  onTime(t) {
    AHK.$('#num').textContent = Math.max(1, AHK.countdown(t, 1.7, 3));
    AHK.$$('.pill-opt[data-ok]').forEach(el => el.classList.toggle('correct', t >= 4.95));
  }
});
</script>
</body>
</html>
