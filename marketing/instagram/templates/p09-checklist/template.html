<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>p09 — Checklist</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .title { font-family: var(--font-display); font-weight: 900; font-size: 54px; line-height: 1.1; max-height: 130px; overflow: hidden; margin-top: 14px; color: var(--navy); }
  .sub { font-size: 30px; color: var(--ink-2); margin-top: 10px; max-height: 50px; overflow: hidden; }
  .list { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
  .item { display: flex; align-items: center; gap: 22px; background: var(--white); border-radius: 20px; padding: 14px 26px; box-shadow: var(--shadow-md); }
  .item .box { width: 54px; height: 54px; border-radius: 16px; background: var(--navy); display: grid; place-items: center; flex: none; }
  .item .box .star { width: 30px; height: 30px; background: var(--gold); }
  .item .txt { font-family: var(--font-body); font-weight: 700; font-size: 31px; line-height: 1.2; max-height: 76px; overflow: hidden; }
  .foot { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .foot .cta { font-size: 30px; padding: 20px 32px; }
  .foot .q { font-size: 30px; font-weight: 600; color: var(--ink-2); max-width: 520px; }
</style>
</head>
<body>
<div class="stage bg-soft on-light">
  <div class="deco-grid"></div>
  <div class="star-wm" style="right:-320px; bottom:-320px; width:900px; height:900px"></div>
  <div class="content" style="top:180px;bottom:130px">
    <div class="label navy" id="label"></div>
    <div class="title" id="title" data-fit="40"></div>
    <div class="sub" id="sub"></div>
    <div class="list" id="list"></div>
    <div class="foot"><span class="q" id="q"></span><span class="cta navy" id="cta"></span></div>
  </div>
</div>
<script src="../../assets/base.js"></script>
<script>
AHK.template({
  format: 'post',
  build(d) {
    AHK.chrome({ tag: 'CHECKLIST' });
    AHK.$('#label').textContent = d.label;
    AHK.$('#title').textContent = d.title;
    AHK.$('#sub').textContent = d.subtitle;
    d.items.forEach(it => AHK.$('#list').append(AHK.h('div.item', [AHK.h('div.box', [AHK.h('i.star')]), AHK.h('div.txt', { 'data-fit': '26' }, it)])));
    AHK.$('#q').textContent = d.question;
    AHK.$('#cta').textContent = d.cta;
  }
});
</script>
</body>
</html>
