<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>p02 — This or that</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .title { font-family: var(--font-display); font-weight: 900; font-size: 72px; line-height: 1.1; max-height: 250px; overflow: hidden; margin-top: 24px; }
  .opts { display: flex; flex-direction: column; gap: 30px; margin-top: 44px; }
  .opt { background: var(--white); color: var(--navy); border-radius: var(--r-lg); padding: 44px 50px; display: flex; gap: 32px; align-items: center; box-shadow: var(--shadow-lg); }
  .opt .k { width: 110px; height: 110px; border-radius: 30px; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 60px; flex: none; }
  .opt .s { font-family: var(--font-body); font-weight: 800; font-size: 50px; line-height: 1.2; max-height: 180px; overflow: hidden; }
  .or { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .3em; opacity: .7; margin: -10px 0; }
  .prompt { margin-top: 50px; font-size: 40px; font-weight: 700; line-height: 1.3; max-height: 130px; overflow: hidden; }
  .prompt mark { color: var(--gold); }
</style>
</head>
<body>
<div class="stage bg-navy on-dark">
  <div class="deco-dots"></div>
  <div class="star-wm" style="right:-300px; bottom:-300px; width:900px; height:900px"></div>
  <div class="content">
    <div class="label" id="label"></div>
    <div class="title" id="title" data-fit="44"></div>
    <div class="opts">
      <div class="opt"><div class="k">A</div><div class="s" id="a" data-fit="30"></div></div>
      <div class="or">or</div>
      <div class="opt"><div class="k">B</div><div class="s" id="b" data-fit="30"></div></div>
    </div>
    <div class="prompt" id="prompt"></div>
  </div>
</div>
<script src="../../assets/base.js"></script>
<script>
AHK.template({
  format: 'post',
  build(d) {
    AHK.chrome({ tag: 'A or B' });
    AHK.$('#label').textContent = d.label;
    AHK.$('#title').textContent = d.title;
    AHK.$('#a').textContent = d.a;
    AHK.$('#b').textContent = d.b;
    AHK.$('#prompt').innerHTML = AHK.rich(d.prompt);
  }
});
</script>
</body>
</html>
