<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r14 — Daily challenge</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .num { font-family: var(--font-display); font-weight: 900; font-size: 110px; line-height: 1; color: var(--gold); letter-spacing: -.04em; }
  .hdr { display: flex; align-items: center; gap: 30px; }
  .num small { font-size: 50px; vertical-align: top; opacity: .8; }
  .words { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 30px; }
  .words span { font-family: var(--font-display); font-weight: 900; font-size: 68px; padding: 25px 42px; border-radius: 30px; background: var(--white); color: var(--navy); box-shadow: var(--shadow-md); white-space: nowrap; }
  .task { margin-top: 50px; font-family: var(--font-body); font-weight: 800; font-size: 60px; line-height: 1.2; max-height: 225px; overflow: hidden; }
  .tm { margin-top: 45px; display: flex; align-items: center; gap: 30px; }
  .tm .timer-bar { flex: 1; background: rgba(255,255,255,.18); height: 32px; }
  .tm .n { font-family: var(--font-display); font-weight: 900; font-size: 70px; min-width: 188px; text-align: right; color: var(--gold); }
  .exbox { position: relative; }
  .exbox .card { background: rgba(255,255,255,.1); color: var(--white); border: 4px dashed rgba(255,255,255,.4); box-shadow: none; padding: 38px 48px; }
  .exbox .lbl { font-size: 30px; letter-spacing: .25em; opacity: .8; font-weight: 700; }
  .exbox .ex { font-size: 45px; font-weight: 600; line-height: 1.3; margin-top: 12px; max-height: 175px; overflow: hidden; }
  .exbox .ex mark { color: var(--gold); }
  .blur { position: absolute; inset: 0; border-radius: var(--r-lg); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); background: rgba(14,31,62,.88); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 42px; letter-spacing: .1em; }
  .ctaRow { margin-top: 38px; }
</style>
</head>
<body>
<div class="stage bg-navy on-dark">
  <div class="deco-dots"></div>
  <div class="deco-ring" style="width:760px;height:760px;right:-300px;bottom:-200px"></div>
  <div class="content">
    <div class="hdr"><div class="label" id="label" data-anim="in-left@0"></div><div class="num" data-anim="in-pop@0.1"><small>#</small><span id="num"></span></div></div>
    <div class="words" id="words"></div>
    <div class="task" id="task" data-fit="40" data-anim="in-up@1.9"></div>
    <div class="slot" style="height:138px">
      <div class="tm" data-anim="in-fade@2.6 out-fade@7.5">
        <div class="timer-bar"><i data-anim="drain@2.8:4.5"></i></div>
        <div class="n" id="sec"></div>
      </div>
    </div>
    <div class="tail">
    <div class="exbox" data-anim="in-up@3.2 out-fade@9.4">
      <div class="card"><div class="lbl">Örnek cevap</div><div class="ex" id="ex"></div></div>
      <div class="blur" data-anim="out-fade@7.5:0.5">🔒 önce sen dene</div>
    </div>
    <div class="ctaRow" data-anim="in-pop@8.3 out-fade@9.4"><div class="cta" id="cta"></div></div>
    </div>
  </div>
  <div class="star-transition" data-anim="star-burst@7.4"></div>
</div>
<script src="../../assets/base.js"></script>
<script>
AHK.template({
  format: 'reel', duration: 10, preview: 8.8,
  build(d) {
    AHK.chrome({ tag: 'CHALLENGE' });
    AHK.$('#label').textContent = d.label;
    AHK.$('#num').textContent = d.number;
    const w = AHK.$('#words');
    d.words.forEach((x, i) => w.append(AHK.h('span', { 'data-anim': `in-pop@${(0.6 + i * 0.3).toFixed(1)} float@${(1.5 + i * 0.4).toFixed(1)}:2.4` }, x)));
    AHK.$('#task').textContent = d.task;
    AHK.$('#ex').innerHTML = AHK.rich(d.example);
    AHK.$('#cta').textContent = d.cta;
  },
  onTime(t) { AHK.$('#sec').textContent = AHK.countdown(t, 2.8, 5) + ' sn'; }
});
</script>
</body>
</html>
