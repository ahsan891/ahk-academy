<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>r06 — Idiom vs literal translation</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .idiom { font-family: var(--font-display); font-weight: 900; font-size: 84px; line-height: 1.08; margin: 26px 0 30px; max-height: 290px; overflow: hidden; }
  .lit { background: rgba(255,255,255,.12); border: 3px dashed rgba(255,255,255,.45); border-radius: var(--r-md); padding: 30px 40px; }
  .lit .lbl { font-size: 26px; letter-spacing: .25em; text-transform: uppercase; font-weight: 700; opacity: .8; }
  .lit .txt { font-family: var(--font-hand); font-size: 66px; line-height: 1.1; margin-top: 10px; max-height: 150px; overflow: hidden; color: var(--gold); }
  .emojis { display: flex; gap: 30px; justify-content: center; margin: 34px 0; font-size: 150px; line-height: 1; }
  .wait { font-family: var(--font-display); font-weight: 700; font-size: 40px; letter-spacing: .1em; text-transform: uppercase; text-align: center; color: var(--gold); }
  .real .lbl { font-size: 26px; letter-spacing: .25em; text-transform: uppercase; font-weight: 700; color: var(--blue); }
  .real .tr { font-family: var(--font-body); font-weight: 800; font-size: 54px; line-height: 1.12; margin-top: 10px; color: var(--navy); max-height: 130px; overflow: hidden; }
  .real .en { font-size: 34px; margin-top: 12px; color: var(--ink-2); max-height: 95px; overflow: hidden; }
  .ex { margin-top: 36px; font-size: 38px; line-height: 1.3; font-weight: 600; max-height: 160px; overflow: hidden; }
  .ex mark { color: var(--gold); }
  .ctaRow { margin-top: 40px; }
</style>
</head>
<body>
<div class="stage bg-blue on-dark">
  <div class="deco-dots"></div>
  <div class="deco-ring" style="width:760px;height:760px;right:-300px;top:-240px"></div>
  <div class="content">
    <div class="label" id="label" data-anim="in-left@0"></div>
    <div class="idiom" id="idiom" data-fit="44" data-anim="in-up@0.15"></div>
    <div class="slot" id="slot">
      <div data-anim="out-fade@5.0">
        <div class="lit" data-anim="in-up@1.2">
          <div class="lbl">Kelime kelime çevirirsek</div>
          <div class="txt" id="lit" data-fit="40"></div>
        </div>
        <div class="emojis emoji" id="emojis"></div>
        <div class="wait" data-anim="in-fade@3.6 blink@3.8:0.8:3">wait for it…</div>
      </div>
      <div data-anim="in-up@5.3 out-fade@10.4">
        <div class="card real">
          <div class="lbl">Gerçek anlamı</div>
          <div class="tr" id="tr" data-fit="34"></div>
          <div class="en" id="en" data-fit="24"></div>
        </div>
        <div class="ex" id="ex" data-anim="in-up@7.4"></div>
        <div class="ctaRow" data-anim="in-pop@8.8"><div class="cta" id="cta"></div></div>
      </div>
    </div>
  </div>
  <div class="star-transition" data-anim="star-burst@5.0"></div>
</div>
<script src="../../assets/base.js"></script>
<script>
AHK.template({
  format: 'reel', duration: 11, preview: 3.0,
  build(d) {
    AHK.chrome({ tag: 'IDIOM' });
    AHK.$('#label').textContent = d.label;
    AHK.$('#idiom').textContent = d.idiom;
    AHK.$('#lit').textContent = d.literal_tr;
    const em = AHK.$('#emojis');
    [...new Intl.Segmenter().segment(d.emojis)].map(s => s.segment).filter(s => s.trim()).forEach((e, i) => em.append(AHK.h('span', { 'data-anim': `in-pop@${(1.9 + i * 0.3).toFixed(1)} wiggle@${(2.5 + i * 0.3).toFixed(1)}` }, e)));
    AHK.$('#tr').textContent = d.meaning_tr;
    AHK.$('#en').textContent = d.meaning_en;
    AHK.$('#ex').innerHTML = AHK.rich(d.example);
    AHK.$('#cta').textContent = d.cta;
  },
  afterFit() {
    const kids = AHK.$$('#slot > *');
    AHK.$('#slot').style.height = Math.max(...kids.map(k => k.offsetHeight)) + 'px';
  }
});
</script>
</body>
</html>
